name: Custom Indexarr container

on:
  workflow_dispatch:
  push:
    branches: [custom/local-category-filter]

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-indexarr-container
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'trick11/indexarr-rs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/trick11/indexarr-custom:latest
            ghcr.io/trick11/indexarr-custom:sha-${{ github.sha }}
          build-args: |
            INDEXARR_BUILD_REF=0.3.2-local-category-filter
            INDEXARR_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
